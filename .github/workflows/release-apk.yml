name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versao (ex: 1.0.1)'
        required: true
        default: '1.0.0'
      version_build:
        description: 'Build number (ex: 1)'
        required: true
        default: '1'
      notes:
        description: 'Notas da versao'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Ensure Android SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: Create .env
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Missing Supabase secrets"
            exit 1
          fi
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Configure signing
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystore/release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore/release.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --build-name=${{ inputs.version_name }} --build-number=${{ inputs.version_build }}

      - name: Compute SHA-256
        id: sha
        shell: bash
        run: echo "sha256=$(sha256sum build/app/outputs/flutter-apk/app-release.apk | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}-${{ inputs.version_build }}
          name: v${{ inputs.version_name }} (build ${{ inputs.version_build }})
          body: ${{ inputs.notes }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false

      - name: Update update.json
        shell: bash
        env:
          VERSION: ${{ inputs.version_name }}
          BUILD: ${{ inputs.version_build }}
          NOTES: ${{ inputs.notes }}
          SHA: ${{ steps.sha.outputs.sha256 }}
        run: |
          cd ..
          jq -n \
            --arg version "$VERSION" \
            --argjson build "$BUILD" \
            --arg url "https://github.com/RicardoG-EngComp/tinder-de-republicas/releases/download/v${VERSION}-${BUILD}/app-release.apk" \
            --arg sha "$SHA" \
            --arg notes "$NOTES" \
            '{version:$version, build:$build, apk_url:$url, sha256:$sha, notes:$notes, mandatory:true}' > update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: update.json v${VERSION}-${BUILD} [skip ci]"
          git push
